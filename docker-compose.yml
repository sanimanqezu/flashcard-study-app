services:
  api:
    build: ./backend
    container_name: flashcard-api
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret-key-in-production-must-be-long-enough
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: flashcard_db
    ports:
    - 8080:8080
    networks:
    - portfolio-net
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: flashcard-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
    - 3000:3000
    depends_on:
    - api
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
