services:
  api:
    build: .
    container_name: flashcard-api
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-production-secret-key-change-this-in-production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: flashcard_db
    ports:
    - 8080:8080
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
